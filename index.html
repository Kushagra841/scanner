<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode Scan Logger</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f2f4f7; color: #1d2733; }
  header { background: #1f3a5f; color: #fff; padding: 14px 24px; font-size: 22px; font-weight: 600; }
  main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; font-size: 22px; padding: 12px; border: 2px solid #9aa7b5; border-radius: 8px; }
  #code { font-size: 34px; padding: 18px; border-color: #1f3a5f; }
  #status { margin-top: 12px; padding: 14px; border-radius: 8px; font-size: 20px; font-weight: 600; background: #e8edf3; text-align: center; }
  #status.ok   { background: #c8f0cf; color: #135c22; }
  #status.dup  { background: #ffe3a3; color: #7a4b00; }
  #status.err  { background: #ffc9c9; color: #8a1111; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  button { font-size: 16px; padding: 12px 18px; border: 0; border-radius: 8px; background: #1f3a5f; color: #fff; cursor: pointer; }
  button.grey { background: #6b7785; }
  button.small { font-size: 13px; padding: 5px 10px; background: #b03030; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e1e6ec; }
  th { background: #eef2f6; position: sticky; top: 0; }
  tr.dup td { background: #fff4d6; }
  .count { font-size: 18px; margin-bottom: 8px; }
  .scroll { max-height: 380px; overflow-y: auto; }
</style>
</head>
<body>
<header>Barcode Scan Logger</header>
<main>
  <div class="card">
    <div class="row">
      <div>
        <label for="packer">Packer name</label>
        <input type="text" id="packer" placeholder="Type your name once" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="card">
    <label for="code">Scan barcode here</label>
    <input type="text" id="code" autocomplete="off" autofocus>
    <div id="status">Ready. Scan a barcode.</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <div class="count" id="count"></div>
      <div style="flex:0 0 auto;display:flex;gap:10px">
        <button id="export">Download Excel (CSV)</button>
        <button id="clear" class="grey">Clear all (admin)</button>
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>Date</th><th>Time</th><th>Packer</th><th>Barcode</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const KEY = "scan_log_v1";
const ADMIN_PIN = "1234";          // change this, it protects "Clear all"

const $ = id => document.getElementById(id);
const codeBox = $("code"), packerBox = $("packer"), statusBox = $("status");

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

const p2 = n => String(n).padStart(2, "0");
const p3 = n => String(n).padStart(3, "0");
const dateStr = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const timeStr = d => `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${p3(d.getMilliseconds())}`;

function beep(freq, ms) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); o.frequency.value = freq; o.connect(ctx.destination);
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, ms);
  } catch (e) {}
}

function setStatus(text, cls) { statusBox.textContent = text; statusBox.className = cls || ""; }

function render() {
  const list = load();
  const today = dateStr(new Date());
  const todays = list.filter(r => r.date === today);
  $("count").textContent = `Scans today: ${todays.length}   |   Total saved: ${list.length}`;
  const body = $("rows"); body.innerHTML = "";
  list.slice(-200).reverse().forEach((r, i) => {
    const tr = document.createElement("tr");
    if (r.dup) tr.className = "dup";
    [list.length - i, r.date, r.time, r.packer, r.code].forEach(v => {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    });
    const del = document.createElement("td");
    const btn = document.createElement("button");
    btn.textContent = "Delete"; btn.className = "small";
    btn.addEventListener("click", () => deleteEntry(list.length - 1 - i));
    del.appendChild(btn); tr.appendChild(del);
    body.appendChild(tr);
  });
}

function deleteEntry(index) {
  const list = load();
  const r = list[index];
  if (!r) return;
  const pin = prompt("Admin PIN to delete this scan:");
  if (pin === null) { codeBox.focus(); return; }
  if (pin !== ADMIN_PIN) { alert("Wrong PIN."); codeBox.focus(); return; }
  if (confirm(`Delete this scan?\n${r.date} ${r.time}\n${r.packer}\n${r.code}`)) {
    list.splice(index, 1);
    save(list); render(); setStatus("Scan deleted.", "");
  }
  codeBox.focus();
}

codeBox.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const now = new Date();                       // exact moment the scan arrives
  const code = codeBox.value.trim();
  codeBox.value = "";
  if (!code) return;

  const packer = packerBox.value.trim();
  if (!packer) {
    setStatus("Please type your name first, then scan again.", "err");
    beep(200, 400); packerBox.focus(); return;
  }

  const list = load();
  const earlier = list.find(r => r.code === code);
  list.push({ date: dateStr(now), time: timeStr(now), packer, code, dup: !!earlier });
  save(list);

  if (earlier) {
    setStatus(`ALREADY SCANNED before (${earlier.date} ${earlier.time}). Saved again.`, "dup");
    beep(300, 500);
  } else {
    setStatus(`Saved: ${code}   at ${timeStr(now)}`, "ok");
    beep(1000, 120);
  }
  render();
});

// keep the scan box ready so the packer never has to click
codeBox.addEventListener("blur", () => setTimeout(() => {
  if (document.activeElement === document.body) codeBox.focus();
}, 50));
document.addEventListener("click", e => {
  if (e.target === packerBox || e.target.tagName === "BUTTON") return;
  codeBox.focus();
});
packerBox.addEventListener("keydown", e => { if (e.key === "Enter") { localStorage.setItem("packer_name", packerBox.value.trim()); codeBox.focus(); } });
packerBox.addEventListener("change", () => localStorage.setItem("packer_name", packerBox.value.trim()));

$("export").addEventListener("click", () => {
  const list = load();
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  // ="..." keeps Excel from turning long barcodes into 8.9E+12
  const lines = ["Date,Time,Packer,Barcode,Repeat scan"].concat(
    list.map(r => [r.date, r.time, q(r.packer), `="${r.code}"`, r.dup ? "YES" : ""].join(","))
  );
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `scans_${dateStr(new Date())}.csv`;
  a.click();
  codeBox.focus();
});

$("clear").addEventListener("click", () => {
  const pin = prompt("Admin PIN to delete ALL saved scans:");
  if (pin === ADMIN_PIN) {
    if (confirm("This deletes every saved scan. Did you download the Excel file first?")) {
      save([]); render(); setStatus("All scans cleared.", "");
    }
  } else if (pin !== null) { alert("Wrong PIN."); }
  codeBox.focus();
});

packerBox.value = localStorage.getItem("packer_name") || "";
render();
codeBox.focus();
</script>
</body>
</html>
